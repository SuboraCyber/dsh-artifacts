<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Фото ещё в пути — рамен уже съели">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05100f"/><stop offset="1" stop-color="#0a201c"/>
    </linearGradient>
    <radialGradient id="mint" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#12a086" stop-opacity=".24"/><stop offset="1" stop-color="#12a086" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12a086"/><stop offset="1" stop-color="#0b5f50"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sg)"/>
  <rect width="400" height="300" fill="url(#mint)"/>

  <!-- пар -->
  <path d="M166 118c-10-16 10-22 0-40" stroke="#8fe3cf" stroke-opacity=".4" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 112c-10-18 10-24 0-46" stroke="#8fe3cf" stroke-opacity=".28" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M234 118c-10-16 10-22 0-40" stroke="#8fe3cf" stroke-opacity=".2" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- пиала -->
  <path d="M104 170h192c0 44-42 74-96 74s-96-30-96-74z" fill="url(#bowl)"/>
  <path d="M104 170h192c0 10-6 18-16 24H120c-10-6-16-14-16-24z" fill="#0b5f50" opacity=".55"/>
  <ellipse cx="200" cy="170" rx="96" ry="17" fill="#0a201c" stroke="#8fe3cf" stroke-opacity=".5" stroke-width="3"/>
  <ellipse cx="200" cy="170" rx="72" ry="11" fill="#123a33"/>

  <!-- пустая пиала: донышко с полосками -->
  <path d="M150 214c30 8 70 8 100 0" stroke="#8fe3cf" stroke-opacity=".35" stroke-width="4" fill="none"/>

  <!-- палочки -->
  <g stroke="#d9b382" stroke-width="8" stroke-linecap="round">
    <line x1="292" y1="96" x2="330" y2="196"/>
    <line x1="308" y1="92" x2="344" y2="192"/>
  </g>

  <!-- кошачья лапка, утащившая нори -->
  <g transform="translate(96 196) rotate(-14)">
    <rect x="0" y="0" width="34" height="22" rx="8" fill="#0d2b26" stroke="#12a086" stroke-width="3"/>
    <circle cx="9" cy="7" r="3" fill="#12a086"/><circle cx="18" cy="5" r="3" fill="#12a086"/><circle cx="27" cy="7" r="3" fill="#12a086"/>
  </g>

  <!-- искры -->
  <g fill="#8fe3cf" opacity=".8">
    <path d="M312 138l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <circle cx="78" cy="108" r="3"/>
    <circle cx="330" cy="252" r="2.5"/>
  </g>
</svg>
